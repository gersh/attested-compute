#
# Prototype build-provenance lane for the attested-provenance trust model.
#
# WHAT THIS WORKFLOW ESTABLISHES
#   A signed, transparency-logged in-toto SLSA provenance statement saying:
#   "these exact artifact digests were produced by this workflow, running at
#   this commit of this repository."
#
# WHAT IT DOES NOT ESTABLISH
#   Nothing about any computation.  It does not say a campaign ran, on what
#   input, for how long, or what Merkle root came out.  Execution evidence is
#   a separate layer (N-way replication); result correctness is a third layer
#   (the unchanged Lean certificate checker).  See
#   docs/ATTESTED_PROVENANCE_TRUST_MODEL.md.
#
# RUNNER POLICY -- LOAD BEARING
#   Every job here MUST run on a GitHub-hosted runner, and each job asserts
#   that at runtime by checking RUNNER_ENVIRONMENT.
#
#   Provenance from a GitHub-hosted runner is worth more than provenance from
#   a self-hosted one, because the build machine is not controlled by the
#   repository owner.  A self-hosted runner's SLSA provenance only says "built
#   by this workflow on a machine the owner controls", which a sceptical third
#   party should discount heavily.  Moving this lane to a self-hosted runner
#   would quietly destroy most of its value, so the guard fails the job
#   instead.
#
#   Campaign EXECUTION is the opposite case and belongs on a self-hosted
#   runner -- specifically the Azure confidential H100 CVM -- because
#   GitHub-hosted runners cap jobs at 6 hours, and the only GitHub-hosted GPU
#   is a Tesla T4 with no confidential-computing mode.  That split is
#   described in docs/ATTESTED_PROVENANCE_TRUST_MODEL.md; no execution
#   workflow is provided here.
#
#   The repository's own local qualification path is about 25 minutes, so it
#   fits the hosted 6-hour job limit with large headroom.
#
# TRIGGER POLICY
#   `workflow_dispatch` only, on purpose.  Merging this file must never start
#   a run.  Adopting the model is a separate, deliberate decision; a tag or
#   release trigger can be added then.
#
# SLSA LEVEL
#   Build L2, and the file documents exactly why it is not L3.  See the
#   "SLSA" section of docs/ATTESTED_PROVENANCE_TRUST_MODEL.md.

name: attested-build-provenance (prototype)

on:
  workflow_dispatch:
    inputs:
      skip-pure-entry:
        description: >-
          Skip the freestanding x86-64 pure-entry ELF (diagnostic only).
        type: boolean
        default: false

# Default to no privileges.  Each job re-declares exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

env:
  # Digest-pinned toolchain container.  A third-party rebuilder must use this
  # same digest; see the reproducible-build section of the trust-model doc.
  # docker.io/library/gcc:13.3.0-bookworm resolved 2026-07-26.
  BUILD_IMAGE: >-
    gcc@sha256:1d71f0f3450214bef38fe09e6f610fb6cca90cf97b43f4ce845bfc32a4168818

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build.  Runs the same script a third party runs.  Has no id-token and no
  #    attestations permission, so nothing in this job can mint a signature.
  # ---------------------------------------------------------------------------
  build:
    name: deterministic native build
    runs-on: ubuntu-24.04
    container:
      image: gcc@sha256:1d71f0f3450214bef38fe09e6f610fb6cca90cf97b43f4ce845bfc32a4168818
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
    steps:
      - name: Require a GitHub-hosted runner
        run: |
          set -o errexit -o nounset -o pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "refusing to produce build provenance on a" \
              "'${RUNNER_ENVIRONMENT:-unset}' runner: provenance signed on" \
              "owner-controlled hardware is not worth what this lane" \
              "claims" >&2
            exit 1
          fi
          echo "runner environment: ${RUNNER_ENVIRONMENT}"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Allow git to read the mounted checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Record the build environment
        run: |
          set -o errexit -o nounset -o pipefail
          {
            echo "image_digest=${BUILD_IMAGE}"
            echo "uname=$(uname -srmo)"
            echo "cc=$(command -v cc || true)"
            cc --version || true
            echo "make=$(make --version | head -1)"
            echo "git=$(git --version)"
          } | tee build-environment.txt

      - name: Deterministic build
        id: build
        run: |
          set -o errexit -o nounset -o pipefail
          args=(--output-dir "${GITHUB_WORKSPACE}/attested-build")
          if [ "${{ inputs.skip-pure-entry }}" = "true" ]; then
            args+=(--skip-pure-entry)
          fi
          ./tools/reproduce_attested_build.sh "${args[@]}"
          manifest="${GITHUB_WORKSPACE}/attested-build/build-manifest.json"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "manifest-sha256=$(sha256sum "${manifest}" | cut -d' ' -f1)" \
            >> "${GITHUB_OUTPUT}"

      - name: Move the environment record next to the artifacts
        run: mv build-environment.txt attested-build/toolchain/

      - name: Upload the build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-build
          path: attested-build/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2. Attest.  A separate job on a separate ephemeral VM.  It runs no build
  #    step from the repository: it downloads the artifacts, recomputes their
  #    digests itself, and signs those digests.  This is the job-level
  #    isolation that separates provenance generation from the build steps.
  #
  #    It is still NOT SLSA Build L3: the workflow definition and its
  #    permissions are controlled by this repository rather than by a trusted
  #    reusable workflow with its own OIDC identity.  Do not describe the
  #    result as L3.
  # ---------------------------------------------------------------------------
  attest:
    name: sign and log provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require a GitHub-hosted runner
        run: |
          set -o errexit -o nounset -o pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "refusing to produce build provenance on a" \
              "'${RUNNER_ENVIRONMENT:-unset}' runner: provenance signed on" \
              "owner-controlled hardware is not worth what this lane" \
              "claims" >&2
            exit 1
          fi
          echo "runner environment: ${RUNNER_ENVIRONMENT}"

      - name: Download the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-build
          path: attested-build

      - name: Independently recompute the artifact digests
        run: |
          set -o errexit -o nounset -o pipefail
          manifest="attested-build/build-manifest.json"
          test -f "${manifest}"
          observed="$(sha256sum "${manifest}" | cut -d' ' -f1)"
          expected="${{ needs.build.outputs.manifest-sha256 }}"
          if [ "${observed}" != "${expected}" ]; then
            echo "manifest digest changed in transit: ${observed} != ${expected}" >&2
            exit 1
          fi
          # Recompute every artifact digest from the bytes rather than
          # trusting the manifest the build job wrote.  Any drift between the
          # manifest and the uploaded bytes stops the run before signing.
          python3 - "${manifest}" attested-build/artifacts <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          claimed = {row["name"]: row["sha256"] for row in manifest["artifacts"]}
          present = sorted(p.name for p in root.iterdir())
          failures = []
          if present != sorted(claimed):
              failures.append(f"artifact set differs: {present} != {sorted(claimed)}")
          for name in present:
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              print(f"{name} claimed={claimed.get(name)} actual={actual}")
              if claimed.get(name) != actual:
                  failures.append(f"{name} digest mismatch")
          if failures:
              raise SystemExit("; ".join(failures))
          print("manifest agrees with the uploaded bytes")
          PY

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: attested-build/artifacts/*

      - name: Upload the Sigstore bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-build-provenance-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record the attestation identity
        run: |
          set -o errexit -o nounset -o pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${{ needs.build.outputs.commit }}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "attestation_id=${{ steps.attest.outputs.attestation-id }}"
            echo "attestation_url=${{ steps.attest.outputs.attestation-url }}"
          } | tee "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # 3. Independent rebuild.  A second, unprivileged VM rebuilds from the same
  #    commit and requires a byte-identical manifest.  This is the in-CI
  #    rehearsal of what a third-party rebuilder does, and it is what makes the
  #    attested digest checkable by someone who does not trust this repository.
  # ---------------------------------------------------------------------------
  independent-rebuild:
    name: reproducible-build check
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: gcc@sha256:1d71f0f3450214bef38fe09e6f610fb6cca90cf97b43f4ce845bfc32a4168818
    permissions:
      contents: read
    steps:
      - name: Require a GitHub-hosted runner
        run: |
          set -o errexit -o nounset -o pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "refusing to produce build provenance on a" \
              "'${RUNNER_ENVIRONMENT:-unset}' runner: provenance signed on" \
              "owner-controlled hardware is not worth what this lane" \
              "claims" >&2
            exit 1
          fi
          echo "runner environment: ${RUNNER_ENVIRONMENT}"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Allow git to read the mounted checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Rebuild
        run: |
          set -o errexit -o nounset -o pipefail
          args=(--output-dir "${GITHUB_WORKSPACE}/rebuild")
          if [ "${{ inputs.skip-pure-entry }}" = "true" ]; then
            args+=(--skip-pure-entry)
          fi
          ./tools/reproduce_attested_build.sh "${args[@]}"

      - name: Download the first build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-build
          path: first-build

      - name: Require byte-identical manifests
        run: |
          set -o errexit -o nounset -o pipefail
          if ! diff -u first-build/build-manifest.json rebuild/build-manifest.json; then
            echo "reproducible-build check FAILED: the two builds disagree" >&2
            exit 1
          fi
          echo "reproducible-build check passed: manifests are byte-identical"
