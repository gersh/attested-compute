name = "SparkInterval"
version = "0.1.0"
defaultTargets = ["SparkInterval", "sparkinterval-gen"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "88d006abbcd1f157f567bd21c7a33c271df9b83b"

[[lean_lib]]
name = "SparkInterval"
roots = ["SparkInterval"]
globs = ["SparkInterval.+"]
precompileModules = false

[[lean_exe]]
name = "sparkinterval-gen"
root = "SparkInterval.GeneratePTX"
