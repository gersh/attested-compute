name = "SparkInterval"
version = "0.1.0"
defaultTargets = ["SparkInterval", "sparkinterval-gen"]

# Keep both batch elaboration and editor workers bounded.  These are weak
# arguments so changing the operational limits does not invalidate proof
# artifacts.  The repository's safe build wrappers add an aggregate cgroup
# limit as a second line of defense.
weakLeanArgs = ["-j1", "-M8192"]
moreGlobalServerArgs = ["-j1", "-M4096"]

# Lean-native proof-architecture metadata.  Pin the release matching the
# repository toolchain; blueprint extraction is documentation tooling and is
# not imported by the mathematical or execution libraries themselves.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "d9013cc08bd2b5483e837368dfa4cc7ead92a5c2"

# Keep mathlib last so its already-pinned transitive revisions take precedence
# over compatible but older revisions requested by documentation tooling.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "88d006abbcd1f157f567bd21c7a33c271df9b83b"

[[lean_lib]]
name = "SparkInterval"
roots = ["SparkInterval"]
globs = ["SparkInterval.+"]
precompileModules = false

[[lean_exe]]
name = "sparkinterval-gen"
root = "SparkInterval.GeneratePTX"

[[lean_exe]]
name = "sparkinterval-check-certificate"
root = "SparkInterval.Certificate.CLI"
