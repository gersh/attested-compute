            b'{"campaign":"ch25-a7-boundary-v1","retained_artifact_sha256":'
            b'"ccc11cecdc398c9d0a9bcf2b1bd4994399557985fe17bc216f0a40eb8eb49f29"}'
        )

        # specifications/DCAP_QVL_0_6_1_UPSTREAM.json, asset linux-x86_64-musl.
